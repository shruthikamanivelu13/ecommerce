<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Ecommerce Project</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/fontawesome.min.css"
        integrity="sha512-SMQ1DwSGiIDyNoXdQae7kUBADdtQa8Xsb3LxBxzAXExZNCCH/36yQSpZSYo1c6ckFshd1iMp9eD9+s9+tdhmyg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="bg-pink-50/40">
    <header class=" bg-pink-600">
        <div class="header-inner mr-10 ml-10 flex justify-between items-center ">


            <div class="logo md:w-[40%]">
                <img src="./assets/logo.png" alt="" class=" w-[80px]  bg-white md:w-[150px]">
            </div>
            <div
                class="btns-header flex flex-row-reverse gap-10 md:flex-row md:justify-between md:items-center md:gap-50 md:w-[60%]">


                <div class="nav ">
                    <ul class="flex gap-5 text-white ">
                        <li class="hidden md:block"><a href="index.html">Home</a></li>
                       
                        <li class="hidden md:block"><a href="index.html">Product</a></li>
                        <li class="hidden md:block">Collections</li>
                        <li class="md:hidden"> <i class="fa-solid fa-bars text-2xl "></i></li>

                    </ul>
                </div>
                <div class="cart-btn relative text-white">
                  <a href="cart.html"> <i class="fa-solid fa-cart-shopping text-2xl"></i></a>
                  <span class="cart-count hidden absolute -top-2 -right-2 bg-yellow-400 text-gray-900 text-[10px] font-bold w-4 h-4 rounded-full items-center justify-center">0</span>
                </div>
            </div>
        </div>
    </header>

    <div class="text-center pt-10">
        <h1 class="text-3xl md:text-4xl font-semibold text-gray-900">Checkout</h1>
        <p class="text-gray-500 text-sm mt-2">Enter your delivery details to place the order</p>
    </div>

    <div class="max-w-5xl mx-auto px-5 py-10 grid grid-cols-1 md:grid-cols-[1.2fr_380px] gap-8 items-start">
        <form id="checkout-form" class="bg-white border border-pink-100 rounded-2xl p-7">
            <h2 class="text-xl font-semibold mb-5 text-gray-900">Delivery Details</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="sm:col-span-2">
                    <label for="fullname" class="block text-xs text-gray-500 mb-1">Full Name</label>
                    <input type="text" id="fullname" required placeholder="Your name"
                        class="w-full border border-pink-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-pink-500">
                </div>
                <div>
                    <label for="phone" class="block text-xs text-gray-500 mb-1">Phone Number</label>
                    <input type="tel" id="phone" pattern="[0-9]{10}" required placeholder="10-digit number"
                        class="w-full border border-pink-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-pink-500">
                </div>
                <div>
                    <label for="email" class="block text-xs text-gray-500 mb-1">Email</label>
                    <input type="email" id="email" required placeholder="you@example.com"
                        class="w-full border border-pink-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-pink-500">
                </div>
                <div class="sm:col-span-2">
                    <label for="address" class="block text-xs text-gray-500 mb-1">Address</label>
                    <input type="text" id="address" required placeholder="House no, street, area"
                        class="w-full border border-pink-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-pink-500">
                </div>
                <div>
                    <label for="city" class="block text-xs text-gray-500 mb-1">City</label>
                    <input type="text" id="city" required placeholder="City"
                        class="w-full border border-pink-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-pink-500">
                </div>
                <div>
                    <label for="pincode" class="block text-xs text-gray-500 mb-1">Pincode</label>
                    <input type="text" id="pincode" pattern="[0-9]{6}" required placeholder="6-digit pincode"
                        class="w-full border border-pink-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-pink-500">
                </div>
            </div>

            <div class="mt-6">
                <label class="block text-xs text-gray-500 mb-2">Payment Method</label>
                <div class="flex gap-3">
                    <label class="flex-1 border border-pink-200 rounded-lg p-3 text-sm flex items-center gap-2 cursor-pointer hover:border-pink-400">
                        <input type="radio" name="payment" value="cod" checked class="accent-pink-600">
                        Cash on Delivery
                    </label>
                    <label class="flex-1 border border-pink-200 rounded-lg p-3 text-sm flex items-center gap-2 cursor-pointer hover:border-pink-400">
                        <input type="radio" name="payment" value="card" class="accent-pink-600">
                        Card / UPI
                    </label>
                </div>
            </div>

            <button type="submit"
                class="w-full text-center bg-pink-600 hover:bg-pink-700 text-white font-semibold py-3 rounded-full mt-8 transition">Place Order</button>
        </form>

        <div class="bg-white border border-pink-100 rounded-2xl p-6 sticky top-5">
            <h2 class="text-xl font-semibold mb-4 text-gray-900">Order Summary</h2>
            <div id="checkout-items" class="flex flex-col gap-3 mb-4"></div>
            <div class="flex justify-between text-sm text-gray-500 mb-2">
                <span>Subtotal</span>
                <span id="checkout-subtotal">₹0</span>
            </div>
            <div class="flex justify-between text-sm text-gray-500 mb-2">
                <span>Shipping</span>
                <span>Free</span>
            </div>
            <div class="flex justify-between text-gray-900 font-bold text-lg border-t border-pink-100 pt-3 mt-1">
                <span>Total</span>
                <span id="checkout-total">₹0</span>
            </div>
        </div>
    </div>

    <footer class="bg-gray-900 text-gray-300 py-6 px-6 md:px-10 text-center text-xs">
        © 2026 Our Store. All rights reserved.
    </footer>

    <script src="script.js"></script>
</body>

</html>
